name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-import-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check syntax (compile all .py files)
        run: python -m py_compile cache.py semantic_cache.py token_optimizer.py router.py main.py benchmark.py

      - name: Import check (módulos sem dependência de rede)
        run: |
          python -c "from cache import AutoCache; c=AutoCache(); c.set('a','b'); assert c.get('a')['response']=='b'"
          python -c "from token_optimizer import TokenOptimizer; TokenOptimizer().optimize('teste')"
          python -c "from router import MCPRouter; MCPRouter().route('codigo')"

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-import-check
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t tokenforge:ci .
