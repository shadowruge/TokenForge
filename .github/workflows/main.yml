name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-import-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check syntax (compile all .py files)
        run: python -m py_compile cache.py semantic_cache.py token_optimizer.py router.py main.py benchmark.py

      - name: Run unit tests
        run: python -m pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-import-check
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t tokenforge:ci .