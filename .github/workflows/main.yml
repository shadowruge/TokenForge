name: MCP System CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v3

    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: 📦 Install deps
      run: |
        pip install -r requirements.txt

    - name: 🧪 Run tests
      run: |
        python -m unittest discover || true

    - name: 📊 Run benchmark
      run: |
        python benchmark.py

    - name: 🔍 Lint
      run: |
        pip install flake8
        flake8 . || true

    - name: 🧠 Validate JSON (MCP Registry)
      run: |
        python -m json.tool registry.json > /dev/null

    - name: 🐳 Build Docker (opcional)
      run: |
        docker build -t mcp-system . || true
